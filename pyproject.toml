[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobauto"
version = "0.1.0"
description = "Job application assistant for Indian job portals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.44",
  "PyYAML>=6.0",
  "Flask>=3.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "gunicorn>=21.2",
]

[project.scripts]
jobauto = "jobauto.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
