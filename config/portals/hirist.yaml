id: hirist
name: "Hirist"
enabled: true
base_url: "https://www.hirist.tech"
adapter: "jobauto.portals.hirist:HiristAdapter"

auth:
  mode: persistent_profile
  login_url: "https://www.hirist.tech/login"
  logged_in_selector: ".user-menu, .profile-dropdown"

search:
  url_template: "https://www.hirist.tech/search/{role_slug}-jobs-in-{location_slug}?exp={exp}&jobAge={days_bucket}"
  results_container: ".job-listing, .search-results, main, .jobs-list"
  result_card: ".job-card, .jobTuple, a[href*='/j/'], article:has(a[href*='/j/'])"
  fields:
    title: ".job-title, h3 a, a[href*='/j/']"
    url: {selector: "h3 a, .job-title a, a[href*='/j/']", attr: "href"}
    company: ".company-name, .job-company"
    location: ".job-location, .location"
    experience: ".job-experience, .experience"
    salary: ".job-salary, .salary"
    posted: ".posted-date, .job-age"
  pagination:
    next: ".pagination .next"
    max_pages: 3

detail:
  jd_body: ".job-description, .jd-content"

apply:
  instant_button: "button.apply-btn, .btn-apply"
  success_indicator: ".applied, .application-success"
