# Fly.io alternative. Needs: fly launch --no-deploy, then fly deploy.
app = "jobauto"
primary_region = "bom"          # Mumbai, closest to Noida

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  JOBAUTO_ALLOW_SIGNUP = "0"
  JOBAUTO_HTTPS = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      path = "/healthz"
      interval = "30s"
      timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
